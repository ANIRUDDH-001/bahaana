services:
  # The model server runs on a Hugging Face Space (deploy/hf-space): one TabPFN request peaks above
  # Render's free 512 MB, measured on Linux. VITE_API_URL points the site at the Space.
  - type: web
    name: bahaana
    runtime: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: web/dist
    envVars:
      - key: VITE_API_URL
        sync: false
